packaging_format = 2

id = "opencloud"
name = "OpenCloud"
description.en = "Online storage, file sharing platform"
description.fr = "Stockage en ligne, plateforme de partage de fichiers"

version = "9.2.0~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "Apache-2.0"
website = "https://opencloud.eu/en"
code = "https://github.com/opencloud-eu/opencloud"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = false

ldap = false
sso = true

disk = "100M"
ram.build = "250M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.language]
    ask.en = "Choose the application language"
    ask.fr = "Choisissez la langue de l'application"
    type = "select"
    choices = ["cs", "de", "en", "es", "fr", "gl", "it"]
    default = "fr"

    [install.password]
    type = "password"

[resources]

    [resources.sources.main]
    extract = false
    rename = "opencloud"
    amd64.url = "https://github.com/opencloud-eu/opencloud/releases/download/v9.2.0/opencloud-9.2.0-linux-amd64"
    amd64.sha256 = "6dd961024170b77838b9c61f0b03767fe9bf27d4ba8265d6537cb2e6a228b9be"
    arm64.url = "https://github.com/opencloud-eu/opencloud/releases/download/v9.2.0/opencloud-9.2.0-linux-arm64"
    arm64.sha256 = "f0778e22f05dae50bfdb6ec50ce6561676387a0947b0cb5a6eb21d8926e98db8"
    armhf.url = "https://github.com/opencloud-eu/opencloud/releases/download/v9.2.0/opencloud-9.2.0-linux-arm"
    armhf.sha256 = "92f7abc80ffcbf16b17fd8cd0fdd0fbcf0564fb7e81af8f37a9178df4b8fa61e"
    i386.url = "https://github.com/opencloud-eu/opencloud/releases/download/v9.2.0/opencloud-9.2.0-linux-386"
    i386.sha256 = "6f1a0fd2f7c46bc692d7a6cbe61ab0abbe993ccf33e669a69be3d64b597e1890"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^opencloud-.*-linux-amd64$"
    autoupdate.asset.arm64 = "^opencloud-.*-linux-arm64$"
    autoupdate.asset.armhf = "^opencloud-.*-linux-arm$"
    autoupdate.asset.i386 = "^opencloud-.*-linux-386$"

    [resources.sources.draw-io]
    url = "https://github.com/opencloud-eu/web-extensions/releases/download/draw-io-v2.2.1/draw-io-2.2.1.zip"
    sha256 = "140f272c992adf76dccdcbddcd225d634be53f5ac9ed90eabe0a3e45f43fa7a1"
    in_subdir = false
    autoupdate.strategy = "latest_github_release"
    autoupdate.upstream = "https://github.com/opencloud-eu/web-extensions"
    autoupdate.version_regex = "^draw-io-v(.*)$"
    autoupdate.asset = "^draw-io-.*.zip"

    [resources.sources.external-sites]
    url = "https://github.com/opencloud-eu/web-extensions/releases/download/external-sites-v2.2.0/external-sites-2.2.0.zip"
    sha256 = "0f9c92f62f9753417e7492e29e67f74c3a1672063f722759575e512187870c11"
    in_subdir = false
    autoupdate.strategy = "latest_github_release"
    autoupdate.upstream = "https://github.com/opencloud-eu/web-extensions"
    autoupdate.version_regex = "^external-sites-v(.*)$"
    autoupdate.asset = "^external-sites-.*.zip"

    [resources.sources.unzip]
    url = "https://github.com/opencloud-eu/web-extensions/releases/download/unzip-v2.2.2/unzip-2.2.2.zip"
    sha256 = "1391f909e04c4dd7db629dac8ba89eef4fad63fcd2e18fad0b06f93589a35647"
    in_subdir = false
    autoupdate.strategy = "latest_github_release"
    autoupdate.upstream = "https://github.com/opencloud-eu/web-extensions"
    autoupdate.version_regex = "^unzip-v(.*)$"
    autoupdate.asset = "^unzip-.*.zip"

    [resources.system_user]
    allow_email = true

    [resources.install_dir]
    
    [resources.data_dir]
    subdirs = ["config", "idm", "idp", "nats", "proxy", "search", "storage"]

    [resources.permissions]
    main.url = "/"
    main.auth_header = false
    api.url = "/api"
    api.auth_header = false
    api.show_tile = false
    api.protected= true
    api.allowed = ["visitors"]

    [resources.ports]
